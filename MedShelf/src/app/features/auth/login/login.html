@if (isLoading()) {
  <div class="loading-container">
    <app-loading></app-loading>
  </div>
}
@if (!isLoading()) {
  <main>
    <div class="login-container">
      <div class="login-hero">
        <h1>MedShelf</h1>
        <p>Tu botiquín digital de confianza</p>
      </div>
      <div class="login-card">
        <div>
          <h1>Bienvenido de nuevo</h1>

          <form class="login-form" (ngSubmit)="onSubmit()">
            @if (errorMessage()) {
              <p class="login-error">{{ errorMessage() }}</p>
            }

            <div class="form-group">
              <label for="email">Correo</label>
              <input
                type="text"
                id="email"
                name="email"
                [ngModel]="email()"
                (ngModelChange)="email.set($event)"
                autocomplete="email"
                (paste)="$event.stopPropagation()"
                placeholder="correo@ejemplo.com"
                [disabled]="isLoading()"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <input
                type="{{ showPassword() ? 'text' : 'password' }}"
                id="password"
                name="password"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                autocomplete="current-password"
                (paste)="$event.stopPropagation()"
                placeholder="•••••••••"
                [disabled]="isLoading()"
                required
              />
              <button 
                type="button" 
                class="btn-show-password"
                (click)="togglePasswordVisibility()"
                [disabled]="isLoading()"
              >
              @if (showPassword()) {
                <lucide-icon [img]="icons.eyeOff"></lucide-icon>
              } @else {
                <lucide-icon [img]="icons.eye"></lucide-icon>
              }
              </button>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading()">
              {{ isLoading() ? 'Iniciando...' : 'Iniciar Sesión' }}
            </button>
          </form>

          <div class="login-footer">
            <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
          </div>
        </div>
        <div class="copyright">
          <p>&copy; 2026 MedShelf. Todos los derechos reservados.</p>
        </div>
      </div>
    </div>
  </main>
}
