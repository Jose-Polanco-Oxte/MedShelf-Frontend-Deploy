<main>
  <div class="register-container">
    <div class="register-card">
      <h1>Crear Cuenta</h1>
      <p class="subtitle">Únete a MedShelf</p>

      <form class="register-form" (ngSubmit)="onSubmit()">
        <p *ngIf="errorMessage" class="register-error">{{ errorMessage }}</p>

        <div class="form-group">
          <label for="fullname">Nombre Completo</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            [(ngModel)]="fullname"
            placeholder="Juan Pérez"
            [disabled]="isLoading"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="correo@ejemplo.com"
            [disabled]="isLoading"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="•••••••••"
            [disabled]="isLoading"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="•••••••••"
            [disabled]="isLoading"
            required
          />
        </div>

        <button type="submit" class="btn-register" [disabled]="isLoading">
          {{ isLoading ? 'Registrando...' : 'Registrarse' }}
        </button>
      </form>

      <div class="register-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>
</main>
