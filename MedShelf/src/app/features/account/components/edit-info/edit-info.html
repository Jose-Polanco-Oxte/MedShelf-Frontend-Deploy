<div class="edit-profile-container">
  <!-- Toast Notification -->
  @if (toastMessage) {
    <div
      [ngClass]="{
        'toast-notification': true,
        'toast-success': true,
        'toast-exit': isToastExiting
      }"
    >
      <div class="toast-content">
        <lucide-angular [img]="icons.checkCircle" size="20" class="toast-icon"></lucide-angular>
        <div class="toast-message">
          <p>{{ toastMessage }}</p>
        </div>
        <button class="toast-close" (click)="closeToast()" type="button">✕</button>
      </div>
    </div>
  }

  <!-- Botón retorno -->
  <div class="header-actions">
    <a routerLink="/account" class="btn-back">
      <lucide-angular [img]="icons.arrowLeft" size="24"></lucide-angular>
    </a>
    <h2>Editar Información</h2>
    <div style="width: 48px;"></div>
  </div>

  <form class="edit-form" (ngSubmit)="saveProfile()">
    <!-- Nombre del usuario -->
    <div class="form-group">
      <label for="name">Nombre</label>
      <input 
        type="text" 
        id="name" 
        [ngModel]="profileData().name"
        (ngModelChange)="updateName($event)"
        name="name"
        required />
    </div>

    <!-- Email del usuario -->
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        [ngModel]="profileData().email"
        (ngModelChange)="updateEmail($event)"
        name="email"
        required />
    </div>

    <!-- Fecha de nacimiento -->
    <div class="form-group">
      <label for="birthDate">Fecha de nacimiento</label>
      <input 
        type="date" 
        id="birthDate" 
        [ngModel]="profileData().birthDate"
        (ngModelChange)="updateBirthDate($event)"
        name="birthDate"
        required />
    </div>

    <!-- Alergias -->
    <div class="form-group">
      <label for="allergyInput">Alergias</label>
      <div class="allergy-input-wrapper">
        <input 
          type="text" 
          id="allergyInput" 
          [ngModel]="allergyInput()"
          (ngModelChange)="allergyInput.set($event)"
          name="allergyInput"
          placeholder="Ej. Penicilina" />
        <button type="button" class="btn-add-allergy" (click)="addAllergy()">+</button>
      </div>
      @if (profileData().allergies.length > 0) {
        <div class="allergies-list">
          @for (allerge of profileData().allergies; let i = $index; track i) {
            <span class="allergy-badge">
              {{ allerge }}
              <button type="button" class="btn-remove" (click)="removeAllergy(i)">✕</button>
            </span>
          }
        </div>
      }
    </div>

    <!-- Botones -->
    <div class="form-actions">
      <button type="submit" class="btn-save">
        <lucide-angular [img]="icons.save" size="20"></lucide-angular>
        Guardar cambios
      </button>
      <!-- <button type="button" class="btn-cancel" (click)="cancel()">
        Cancelar
      </button> -->
    </div>
  </form>
</div>
