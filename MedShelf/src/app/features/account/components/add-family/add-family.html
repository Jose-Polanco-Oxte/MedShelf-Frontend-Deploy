<div class="add-family-container">
  @if (toastMessage) {
    <div
      [ngClass]="{
        'toast-notification': true,
        'toast-success': !isErrorToast,
        'toast-error': isErrorToast,
        'toast-exit': isToastExiting,
      }"
    >
      <div class="toast-content">
        @if (isErrorToast) {
          <lucide-angular [img]="icons.warning" size="20" class="toast-icon"></lucide-angular>
        } @else {
          <lucide-angular [img]="icons.checkCircle" size="20" class="toast-icon"></lucide-angular>
        }
        <div class="toast-message">
          <p>{{ toastMessage }}</p>
        </div>
        <button class="toast-close" (click)="closeToast()" type="button">✕</button>
      </div>
    </div>
  }

  <div class="header-actions">
    <a routerLink="/account" class="btn-back">
      <lucide-angular [img]="icons.arrowLeft" size="24"></lucide-angular>
    </a>
    <h2>Agregar Familia</h2>
    <div style="width: 48px"></div>
  </div>

  <form class="add-family-form" (ngSubmit)="addFamilyMember()">
    <div class="form-group">
      <label for="name">Nombre completo</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="familyData.name"
        name="name"
        placeholder="Ej. María García"
        required
      />
    </div>

    <div class="form-group">
      <label for="relation">Relación</label>
      <select
        id="relation"
        [(ngModel)]="familyData.relationship"
        name="relation"
        class="select-input"
        required
      >
        <option value="">Selecciona una relación</option>
        @for (rel of relations; track rel) {
          <option [value]="rel">{{ rel }}</option>
        }
      </select>
    </div>

    <!-- Fecha con fix de picker -->
    <div class="form-group" (click)="openDatePicker()">
      <label for="birthDate">Fecha de nacimiento</label>
      <input
        #birthDateInput
        type="date"
        id="birthDate"
        [(ngModel)]="familyData.birthDate"
        [max]="maxBirthDate"
        name="birthDate"
        required
      />
    </div>

    <div class="form-group">
      <label for="allergyInput">Alergias</label>
      <div class="allergy-input-wrapper">
        <input
          type="text"
          id="allergyInput"
          [(ngModel)]="allergyInput"
          name="allergyInput"
          placeholder="Ej. Penicilina"
        />
        <button type="button" class="btn-add-allergy" (click)="addAllergy()">+</button>
      </div>
      @if (familyData.allergies.length > 0) {
        <div class="allergies-list">
          @for (allerge of familyData.allergies; let i = $index; track i) {
            <span class="allergy-badge">
              {{ allerge }}
              <button type="button" class="btn-remove" (click)="removeAllergy(i)">✕</button>
            </span>
          }
        </div>
      }
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save" [disabled]="isLoading">
        @if (isLoading) {
          <lucide-angular [img]="icons.loader" size="20" class="spinner"></lucide-angular>
        } @else {
          <lucide-angular [img]="icons.save" size="20"></lucide-angular>
        }
        {{ isLoading ? 'Agregando...' : 'Agregar miembro' }}
      </button>
    </div>
  </form>
</div>
