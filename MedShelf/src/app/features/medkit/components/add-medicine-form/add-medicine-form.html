<form class="form" (ngSubmit)="saveMedicine()">
  <div class="fab-return">
    <a routerLink="/medkit" title="Volver">
      <lucide-angular [img]="icons.arrowLeft" size="24" class="fab-icon"></lucide-angular>
    </a>
  </div>
  <h2>Agregar medicamento</h2>

  @if (errorMessage) {
    <div class="form-error">
      <p>{{ errorMessage }}</p>
    </div>
  }

  <div class="form-group">
    <label>Producto</label>
    <select name="productId" id="productId" [(ngModel)]="formData.productId" required>
      <option value="">Selecciona un producto</option>
      @for (product of products; track product.id) {
        <option [value]="product.id">{{ product.name }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Lugar</label>
    <select name="placeId" id="placeId" [(ngModel)]="formData.placeId" required>
      <option value="">Selecciona un lugar</option>
      @for (place of places; track place.id) {
        <option [value]="place.id">{{ place.name }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Fecha de vencimiento</label>
    <input type="date" name="expirationDate" [(ngModel)]="formData.expirationDate" required />
  </div>

  <button type="submit" class="submit-btn" [disabled]="isLoading">
    <lucide-angular [img]="icons.check" size="20" class="btn-icon"></lucide-angular>
    {{ isLoading ? 'Guardando...' : 'Guardar Medicamento' }}
  </button>
</form>
